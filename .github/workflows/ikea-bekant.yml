name: IKEA Bekant

on:
  merge_group:
    types:
      - checks_requested

  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  context:
    name: Context
    uses: ./.github/workflows/context.yml

  full:
    name: Full
    needs: context
    runs-on: ubuntu-latest

    strategy:
      matrix:
        environment: ${{ fromJSON(needs.context.outputs.pio-environments) }}
        exclude:
          - environment: attiny841

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore Cache for PlatformIO
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          fail-on-cache-miss: ${{ runner.environment == 'github-hosted' }}
          key: platformio-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('platformio.ini')
          path: .platformio/.cache/downloads

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: 3.11
          version: latest-known

      - name: PlatformIO build
        env:
          PIO_ENVIRONMENT: ${{ matrix.environment }}
        run: |
          cat <<'EOL' > include/esp/secrets.h
          #pragma once
          #ifdef ARDUINO_ARCH_ESP32
          #define HOSTNAME "bekant"
          #define MQTT_HOST "localhost"
          #define MQTT_KEY "redacted"
          #define MQTT_USER "redacted"
          #define NAME "Bekant"
          #define OTA_KEY "redacted"
          #define PIN_ADC 1
          #define PIN_LED 2
          #define PIN_MISO 3
          #define PIN_MOSI 4
          #define PIN_OE 5
          #define PIN_RST 6
          #define PIN_SCK 7
          #define PIN_TPDN 8
          #define PIN_TPUP 9
          #define WIFI_KEY "redacted"
          #define WIFI_SSID "redacted"
          #endif // ARDUINO_ARCH_ESP32
          EOL
          uv run pio run -e "$PIO_ENVIRONMENT"

  minimal:
    name: Minimal
    needs: context
    runs-on: ubuntu-latest

    strategy:
      matrix:
        environment: ${{ fromJSON(needs.context.outputs.pio-environments) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore Cache for PlatformIO
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          fail-on-cache-miss: ${{ runner.environment == 'github-hosted' }}
          key: platformio-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('platformio.ini')
          path: .platformio/.cache/downloads

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: 3.11
          version: latest-known

      - name: PlatformIO build
        env:
          PIO_ENVIRONMENT: ${{ matrix.environment }}
        run: |
          cat <<'EOL' > include/esp/secrets.h
          #pragma once
          #ifdef ARDUINO_ARCH_ESP32
          #define HOSTNAME "bekant"
          #define MQTT_HOST "localhost"
          #define MQTT_KEY "redacted"
          #define MQTT_USER "redacted"
          #define NAME "Bekant"
          #define PIN_MISO 1
          #define PIN_MOSI 2
          #define PIN_RST 3
          #define PIN_SCK 4
          #define WIFI_KEY "redacted"
          #define WIFI_SSID "redacted"
          #endif // ARDUINO_ARCH_ESP32
          EOL
          uv run pio run -e "$PIO_ENVIRONMENT"
