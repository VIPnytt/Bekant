avr:
  - changed-files:
    - any-glob-to-any-file:
      - include/avr/**/*
      - src/avr/**/*

bug:
  - head-branch:
    - ^fix/

chore:
  - head-branch:
    - ^chore/

documentation:
  - head-branch:
    - ^docs/

enhancement:
  - head-branch:
    - ^feat/

esp:
  - changed-files:
    - any-glob-to-any-file:
      - include/esp/**/*
      - src/esp/**/*
