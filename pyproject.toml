[project]
name = "bekant"
version = "1.0.2"
readme = { file = "README.md", content-type = "text/markdown" }
classifiers = ["Private :: Do Not Upload"]
requires-python = ">=3.11"

[dependency-groups]
cpplint = [
    "cpplint==2.0.2",
]
dev = [
    { include-group = "cpplint" },
    { include-group = "platformio" },
]
platformio = [
    "platformio==6.2.0",
]
